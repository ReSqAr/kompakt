[package]
name = "zslg-consensus-types"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The cluster's vocabulary: who is in it, what state it replicates, and the rules that state must obey"
publish = false

[dependencies]
metrics-kit = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
zslg-log-types = { workspace = true }
zslg-net-types = { workspace = true }
zslg-node-types = { workspace = true }
zslg-snapshot-types = { workspace = true }
zslg-time-types = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
postcard = { workspace = true, features = ["alloc", "use-std"] }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.layer]
role = "types"
