[package]
name = "btrb-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The seam between the btrb platform and an app: the App trait, the app list and its boot"
publish = false

[dependencies]
axum = { workspace = true }
btrb-background = { workspace = true }
btrb-cli = { workspace = true }
btrb-config = { workspace = true }
btrb-db = { workspace = true }
btrb-live = { workspace = true }
btrb-types = { workspace = true }
btrb-web = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
nvzn = { workspace = true }
objectstorage-cache = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
nvzn = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["time", "macros", "rt", "test-util"] }

[lints]
workspace = true

[package.metadata.layer]
role = "assembly"
