[package]
name = "btrb-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The btrb process roles: serve, work, standalone and the CLI, composed from the capabilities"
publish = false

[features]
# zslg publishes jemalloc's stats as gauges. Declaring the allocator is the
# binary's; the gauges mean something only when it did.
jemalloc = ["zslg/jemalloc"]

[dependencies]
axum = { workspace = true }
btrb-app = { workspace = true }
btrb-background = { workspace = true }
btrb-cli = { workspace = true }
btrb-config = { workspace = true }
btrb-db = { workspace = true }
btrb-live = { workspace = true }
btrb-metrics = { workspace = true }
btrb-web = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
nvzn = { workspace = true, features = ["prometheus"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "io-util", "macros", "rt", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
zslg = { workspace = true, features = ["prometheus", "s3"] }

[dev-dependencies]
nvzn = { workspace = true, features = ["prometheus", "testing"] }
tokio = { workspace = true, features = ["time", "macros", "rt", "test-util"] }

[lints]
workspace = true

[package.metadata.layer]
role = "assembly"
