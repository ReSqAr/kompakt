[package]
name = "btrb-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The btrb web capability: HTTP mechanisms, response layers and the deployment facts an app is built with"
publish = false

[dependencies]
axum = { workspace = true }
blake3 = { workspace = true }
btrb-config = { workspace = true }
btrb-types = { workspace = true }
metrics = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tower-http = { workspace = true, features = ["set-header", "timeout", "trace"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "macros", "rt", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
