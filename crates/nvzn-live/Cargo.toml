[package]
name = "nvzn-live"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "Live views: the folded state plus the few events received above it, readable at once"
publish = false

[dependencies]
crossbeam-combinators = { workspace = true }
metrics-kit = { workspace = true }
nvzn-projection = { workspace = true }
nvzn-projector = { workspace = true }
nvzn-resultset = { workspace = true }
nvzn-store = { workspace = true }
nvzn-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = { workspace = true }
zslg = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }
nvzn-fixtures = { workspace = true }
nvzn-store-fake = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
tokio-util = { workspace = true }
zslg = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[package.metadata.layer]
role = "assembly"
