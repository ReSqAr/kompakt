[package]
name = "nvzn-dispatcher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The nvzn runtime: the fold, its supervisor, readers and live views"
publish = false

[dependencies]
bytes = { workspace = true }
crossbeam-combinators = { workspace = true }
metrics-kit = { workspace = true }
nvzn-projector = { workspace = true }
nvzn-resultset = { workspace = true }
nvzn-projection = { workspace = true }
nvzn-store = { workspace = true }
nvzn-store-fake = { workspace = true, optional = true }
nvzn-store-rocksdb = { workspace = true }
nvzn-types = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net"] }
tokio-util = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
zslg = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
crossbeam-channel = { workspace = true }
nvzn-fixtures = { workspace = true }
nvzn-store-fake = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
zslg = { workspace = true, features = ["testing"] }

[features]
testing = ["dep:nvzn-store-fake"]

[lints]
workspace = true

[package.metadata.layer]
role = "assembly"
