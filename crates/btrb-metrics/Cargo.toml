[package]
name = "btrb-metrics"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The btrb metrics capability: the Prometheus recorder, process gauges and the /metrics listener"
publish = false

[dependencies]
axum = { workspace = true }
btrb-config = { workspace = true }
btrb-types = { workspace = true }
memory-stats = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
nvzn = { workspace = true, features = ["prometheus"] }
tokio = { workspace = true, features = ["net", "rt"] }
tracing = { workspace = true }
zslg = { workspace = true, features = ["prometheus"] }

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
