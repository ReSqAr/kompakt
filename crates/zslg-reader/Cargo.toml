[package]
name = "zslg-reader"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The learner's reader: stable/unstable splice and quorum-read freshness"
publish = false

[dependencies]
zslg-error = { workspace = true }
zslg-quorum-read = { workspace = true }
async-trait = { workspace = true }
crossbeam-combinators = { workspace = true, features = ["tokio"] }
error-union = { workspace = true }
metrics-kit = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
crossbeam-channel = { workspace = true }
zslg-consensus-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
# `QuorumReadDebouncer::for_test`, for the tests of the crates that build a reader.
testing = []

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
