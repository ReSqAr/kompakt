[package]
name = "zslg-replica-log"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The replica log in RocksDB with its flush loop"
publish = false

[dependencies]
zslg-error = { workspace = true }
bytes = { workspace = true }
zslg-quorum-read = { workspace = true }
bytesize = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-combinators = { workspace = true }
error-union = { workspace = true }
metrics-kit = { workspace = true }
parking_lot = { workspace = true }
rocksdb-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
bytesize = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
crossbeam-combinators = { workspace = true, features = ["tokio", "testing"] }
rocksdb-kit = { workspace = true, features = ["testing"] }
zslg-log-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
# `ReplicaLogStore::open_with_flush`, `ReplicaLogConfig::for_test`, for harnesses.
testing = []

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
