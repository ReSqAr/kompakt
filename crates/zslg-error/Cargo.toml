[package]
name = "zslg-error"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The public error union shared by every node and re-exported by the facade"
publish = false

[dependencies]
crossbeam-combinators = { workspace = true }
bytesize = { workspace = true }
error-union = { workspace = true }
framing = { workspace = true }
rocksdb-kit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
shutdown = { workspace = true }
zslg-consensus = { workspace = true }
zslg-leader = { workspace = true }
zslg-leader-compaction = { workspace = true }
zslg-leader-integrator = { workspace = true }
zslg-leader-membership = { workspace = true }
zslg-leader-snapshot = { workspace = true }
zslg-learner = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-local-store = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-net-client = { workspace = true }
zslg-net-server = { workspace = true }
zslg-net-setup = { workspace = true }
zslg-net-wire = { workspace = true }
zslg-node-id = { workspace = true }
zslg-object-store-config = { workspace = true }
zslg-observability = { workspace = true }
zslg-quorum-read = { workspace = true }
zslg-raft = { workspace = true }
zslg-raft-node = { workspace = true }
zslg-raft-setup = { workspace = true }
zslg-raft-startup = { workspace = true }
zslg-raft-storage = { workspace = true }
zslg-raft-tracker = { workspace = true }
zslg-reader = { workspace = true }
zslg-replica-log = { workspace = true }
zslg-replica-service = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-stable-archive = { workspace = true }
zslg-stable-log = { workspace = true }
zslg-subscriber = { workspace = true }
zslg-time = { workspace = true }
zslg-writer = { workspace = true }

[lints]
workspace = true

[package.metadata.layer]
role = "assembly"
