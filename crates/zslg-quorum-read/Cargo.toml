[package]
name = "zslg-quorum-read"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "Quorum fan-out and replica polling, shared by readers and leaders"
publish = false

[dependencies]
error-union = { workspace = true }
metrics-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid = { workspace = true }

[lints]
workspace = true

[package.metadata.layer]
role = "procedure"
