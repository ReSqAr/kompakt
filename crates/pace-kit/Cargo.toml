[package]
name = "pace-kit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "A floor on a loop's iteration rate"
publish = false

[dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

[lints]
workspace = true

[package.metadata.layer]
role = "library"
