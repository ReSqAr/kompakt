[package]
name = "zslg-log-types"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The replicated log's vocabulary: records, positions, events and the errors of reading and writing them"
publish = false

[dependencies]
bytes = { workspace = true }
crossbeam-combinators = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true }
zslg-node-types = { workspace = true }
zslg-time-types = { workspace = true }

[dev-dependencies]
postcard = { workspace = true, features = ["alloc", "use-std"] }

[lints]
workspace = true

[package.metadata.layer]
role = "types"
