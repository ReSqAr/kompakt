[package]
name = "btrb-db"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The btrb db capability: the zslg node and nvzn dispatcher bring-up, the fold supervisor and the cache"
publish = false

[dependencies]
btrb-config = { workspace = true }
btrb-types = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
nvzn = { workspace = true }
object_store = { workspace = true }
objectstorage-cache = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zslg = { workspace = true, features = ["s3"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "macros", "rt", "test-util"] }

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
