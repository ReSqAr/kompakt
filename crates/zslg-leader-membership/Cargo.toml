[package]
name = "zslg-leader-membership"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The leader membership jobs: liveness, replica-set changes and voter eviction"
publish = false

[dependencies]
zslg-error = { workspace = true }
shutdown = { workspace = true }
pace-kit = { workspace = true }
zslg-quorum-read = { workspace = true }
async-trait = { workspace = true }
error-union = { workspace = true }
futures = { workspace = true }
metrics-kit = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
metrics = { workspace = true }
metrics-util = { workspace = true }
proptest = { workspace = true }
zslg-consensus-fake = { workspace = true }
zslg-net-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
testing = []

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
