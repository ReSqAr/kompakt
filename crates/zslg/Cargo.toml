[package]
name = "zslg"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "A replicated, eventually-stable HLC-ordered log"
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
zslg-log-fake = { workspace = true, optional = true }
zslg-net = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }
bytesize = { workspace = true }
console-subscriber = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
zslg-consensus = { workspace = true }
zslg-log = { workspace = true }
zslg-object-store-config = { workspace = true }
zslg-observability = { workspace = true }
zslg-follower-node = { workspace = true }
zslg-learner-node = { workspace = true }
zslg-replica-node = { workspace = true, features = ["testing"] }
zslg-writer-node = { workspace = true }

[dev-dependencies]
tracing = { workspace = true }
shutdown = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net", "test-util"] }
tokio-util = { workspace = true, features = ["io-util"] }
metrics = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
crossbeam-combinators = { workspace = true, features = ["testing"] }
clap = { workspace = true, features = ["env"] }
tracing-subscriber = { workspace = true, features = ["json"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
pprof = { workspace = true }
time = { workspace = true }
tokio-metrics = { workspace = true }


[features]
# zslg's deliberate public testing surface (`zslg::testing`): an in-memory log.
testing = ["dep:zslg-log-fake"]
default = []
s3 = ["zslg-object-store-config/s3"]
prometheus = ["dep:metrics-exporter-prometheus", "zslg-observability/prometheus"]
tokio-console = ["dep:console-subscriber"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl", "zslg-observability/jemalloc"]
heap-profiling = ["jemalloc", "tikv-jemallocator/profiling"]

[[example]]
name = "replica"
path = "examples/replica.rs"
required-features = ["s3", "prometheus"]

[[example]]
name = "follower"
path = "examples/follower.rs"
required-features = ["s3", "prometheus"]

[[example]]
name = "loadgen"
path = "examples/loadgen.rs"
required-features = ["prometheus"]

[package.metadata.layer]
role = "facade"
