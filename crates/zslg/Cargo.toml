[package]
name = "zslg"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "A replicated, eventually-stable HLC-ordered log"
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
bytesize = { workspace = true }
bytes = { workspace = true }
console-subscriber = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
crossbeam-combinators = { workspace = true, features = ["tokio"] }
dashmap = { workspace = true }
error-union = { workspace = true }
framing = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-kit = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
object_store = { workspace = true }
raft-kit = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rocksdb-kit = { workspace = true }
serde = { workspace = true, features = ["rc"] }
shutdown = { workspace = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net"] }
tokio-util = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
warn-throttle = { workspace = true }
zslg-consensus = { workspace = true }
zslg-consensus-types = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-log-types = { workspace = true }
zslg-net = { workspace = true }
zslg-net-wire = { workspace = true }
zslg-net-types = { workspace = true }
zslg-node-types = { workspace = true }
zslg-quorum-read = { workspace = true }
zslg-object-store-config = { workspace = true }
zslg-node-id = { workspace = true }
zslg-object-store = { workspace = true }
zslg-hlc-clock = { workspace = true }
zslg-hlc-gate = { workspace = true }
zslg-net-client = { workspace = true }
zslg-net-server = { workspace = true }
zslg-net-router = { workspace = true }
zslg-raft-storage = { workspace = true }
backoff-kit = { workspace = true }
zslg-peers = { workspace = true }
zslg-raft-rpc = { workspace = true }
zslg-raft-state = { workspace = true }
zslg-raft-tracker = { workspace = true }
zslg-raft-node = { workspace = true }
zslg-raft-startup = { workspace = true }
zslg-local-store = { workspace = true }
zslg-stable-log = { workspace = true }
zslg-stable-archive = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-snapshot-types = { workspace = true }
zslg-time = { workspace = true }
zslg-time-types = { workspace = true }

[dev-dependencies]
zslg-local-store = { workspace = true, features = ["testing"] }
zslg-log-fake = { workspace = true }
zslg-raft-node = { workspace = true, features = ["testing"] }
zslg-consensus-fake = { workspace = true }
zslg-raft-storage = { workspace = true, features = ["testing"] }
crossbeam-combinators = { workspace = true, features = ["testing"] }
uuid = { workspace = true, features = ["serde"] }
zslg-net-wire = { workspace = true, features = ["testing"] }
zslg-net-client = { workspace = true, features = ["testing"] }
rocksdb-kit = { workspace = true, features = ["testing"] }
clap = { workspace = true, features = ["env"] }
tracing-subscriber = { workspace = true, features = ["json"] }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
metrics-util = { workspace = true }
pprof = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-metrics = { workspace = true }


[features]
default = []
s3 = ["zslg-object-store-config/s3"]
prometheus = ["dep:metrics-exporter-prometheus"]
tokio-console = ["dep:console-subscriber"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
heap-profiling = ["jemalloc", "tikv-jemallocator/profiling"]

[[example]]
name = "replica"
path = "examples/replica.rs"
required-features = ["s3", "prometheus"]

[[example]]
name = "follower"
path = "examples/follower.rs"
required-features = ["s3", "prometheus"]

[[example]]
name = "loadgen"
path = "examples/loadgen.rs"
required-features = ["prometheus"]

[package.metadata.layer]
role = "monolith"
