[package]
name = "zslg-local-store"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The learner's local store: integrated replica data in RocksDB"
publish = false

[dependencies]
zslg-error = { workspace = true }
bytes = { workspace = true }
shutdown = { workspace = true }
async-trait = { workspace = true }
bytesize = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-combinators = { workspace = true, features = ["tokio"] }
error-union = { workspace = true }
metrics-kit = { workspace = true }
parking_lot = { workspace = true }
rocksdb-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
crossbeam-combinators = { workspace = true, features = ["tokio", "testing"] }
rocksdb-kit = { workspace = true, features = ["testing"] }
futures = { workspace = true }
bytesize = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
zslg-consensus-fake = { workspace = true }
zslg-log-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
# `create_local_store` / `run_integrate_worker`, for harnesses of crates that run a store.
testing = []

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
