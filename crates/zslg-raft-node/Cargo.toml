[package]
name = "zslg-raft-node"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The raft node over the consensus engine"
publish = false

[dependencies]
zslg-error = { workspace = true }
async-trait = { workspace = true }
error-union = { workspace = true }
futures = { workspace = true }
metrics-kit = { workspace = true }
raft-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
# `RaftNode::demote_to_learner_for_test`, for the tests of the crates that run a node.
testing = []

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
