[package]
name = "nvzn-store-rocksdb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The nvzn Store on RocksDB"
publish = false

[dependencies]
postcard = { workspace = true, features = ["alloc", "use-std"] }
zslg = { workspace = true }
bytes = { workspace = true }
metrics-kit = { workspace = true }
nvzn-store = { workspace = true }
nvzn-types = { workspace = true }
rust-rocksdb = { workspace = true }

[dev-dependencies]
metrics = { workspace = true }
metrics-util = { workspace = true }
nvzn-fixtures = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
