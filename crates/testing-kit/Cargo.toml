[package]
name = "testing-kit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "Deadline-bounded waits, collision-free ports and log setup for async tests"
publish = false

[dependencies]
tokio = { workspace = true, features = ["time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[package.metadata.layer]
role = "library"
