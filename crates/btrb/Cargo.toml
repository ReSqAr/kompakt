[package]
name = "btrb"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The btrb platform for apps: one dependency that re-exports the crates behind it"

[features]
# zslg publishes jemalloc's stats as gauges. Declaring the allocator is the
# binary's; the gauges mean something only when it did.
jemalloc = ["btrb-host/jemalloc"]

[dependencies]
btrb-app = { workspace = true }
btrb-config = { workspace = true }
btrb-host = { workspace = true }
btrb-live = { workspace = true }

[dev-dependencies]
nvzn = { workspace = true, features = ["testing"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "rt", "test-util"] }

[lints]
workspace = true

[package.metadata.layer]
role = "facade"
