[package]
name = "zslg-raft-setup"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "Raft assembly: wires storage, RPC, state publishing and the node for one openraft instance"
publish = false

[dependencies]
zslg-error = { workspace = true }
error-union = { workspace = true }
raft-kit = { workspace = true }
rocksdb-kit = { workspace = true }
shutdown = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-raft-node = { workspace = true }
zslg-raft-rpc = { workspace = true }
zslg-raft-startup = { workspace = true }
zslg-raft-state = { workspace = true }
zslg-raft-storage = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }
bytesize = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
testing-kit = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
zslg-raft-fake = { workspace = true, optional = true }

[dev-dependencies]
bytesize = { workspace = true }
tempfile = { workspace = true }
testing-kit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
zslg-error = { workspace = true }
zslg-hlc-clock = { workspace = true }
zslg-consensus-fake = { workspace = true }
zslg-net-client = { workspace = true, features = ["testing"] }
zslg-net-fake = { workspace = true }
zslg-net-wire = { workspace = true, features = ["testing"] }
zslg-net-setup = { workspace = true }
zslg-raft-fake = { workspace = true }
zslg-raft-storage = { workspace = true, features = ["testing"] }
zslg-time = { workspace = true }
shutdown = { workspace = true }

[features]
# An in-process cluster of real Raft nodes on the in-memory network, for tests.
testing = [
    "dep:bytesize",
    "dep:tempfile",
    "dep:testing-kit",
    "dep:tokio",
    "dep:zslg-raft-fake",
    "zslg-raft-storage/testing",
]

[lints]
workspace = true

[package.metadata.layer]
role = "assembly"
