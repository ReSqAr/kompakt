[package]
name = "zslg-net-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "RPC server: accept, dispatch and the streaming handlers"
publish = false

[dependencies]
async-trait = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-combinators = { workspace = true, features = ["tokio"] }
error-union = { workspace = true }
futures = { workspace = true }
metrics-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-net-wire = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "test-util"] }
zslg-net-wire = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
