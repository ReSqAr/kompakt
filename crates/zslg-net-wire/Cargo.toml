[package]
name = "zslg-net-wire"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The RPC wire: messages, frame codec and TCP setup"
publish = false

[dependencies]
bytesize = { workspace = true }
error-union = { workspace = true }
framing = { workspace = true }
futures = { workspace = true }
metrics-kit = { workspace = true }
openraft = { workspace = true }
postcard = { workspace = true, features = ["alloc", "use-std"] }
serde = { workspace = true, features = ["derive"] }
socket2 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
zslg-consensus = { workspace = true }
zslg-lifecycle-types = { workspace = true }
zslg-log = { workspace = true }
zslg-net = { workspace = true }
zslg-raft = { workspace = true }
zslg-snapshot = { workspace = true }
zslg-time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util", "net", "time"] }

[features]
# `SocketOpts::for_test`, for the tests of the crates that dial.
testing = []

[lints]
workspace = true

[package.metadata.layer]
role = "procedure"
