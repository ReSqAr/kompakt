[package]
name = "zslg-raft-types"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "openraft's vocabulary for the cluster: the replicated write, its response, node info and the type configuration"
publish = false

[dependencies]
raft-kit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
zslg-consensus-types = { workspace = true }
zslg-net-types = { workspace = true }
zslg-node-types = { workspace = true }

[lints]
workspace = true

[package.metadata.layer]
role = "types"
