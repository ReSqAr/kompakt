[package]
name = "btrb-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "The btrb CLI capability: the worker's admin socket and the console a command talks to"
publish = false

[dependencies]
btrb-config = { workspace = true }
btrb-types = { workspace = true }
futures = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
rpassword = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "test-util"] }

[lints]
workspace = true

[package.metadata.layer]
role = "implementation"
