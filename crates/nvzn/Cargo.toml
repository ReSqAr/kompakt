[package]
name = "nvzn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ReSqAr/kompakt"
description = "Projections folded from an append-only log"
publish = false

[dependencies]
nvzn-dispatcher = { workspace = true }
nvzn-projection = { workspace = true }
nvzn-store = { workspace = true }
metrics-kit = { workspace = true }
async-trait = { workspace = true }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net"] }
tokio-util = { workspace = true, features = ["io-util"] }
zslg = { workspace = true, optional = true }


[dev-dependencies]
nvzn-dispatcher = { workspace = true, features = ["testing"] }
nvzn-projector = { workspace = true }
nvzn-store-rocksdb = { workspace = true }
nvzn-types = { workspace = true }
bytes = { workspace = true }
crossbeam-combinators = { workspace = true }
tracing = { workspace = true }
nvzn-fixtures = { workspace = true }
zslg = { workspace = true, features = ["testing"] }
serde = { workspace = true }
metrics-util = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[example]]
name = "todo"
path = "examples/todo.rs"
required-features = ["testing"]

[[test]]
name = "public_api"
path = "tests/public_api.rs"
required-features = ["testing"]

[features]
default = []
prometheus = ["dep:metrics-exporter-prometheus", "zslg?/prometheus"]
# An in-process log and store (`nvzn::testing`), so a consumer can test
# against nvzn without standing up zslg. For `[dev-dependencies]`.
testing = ["dep:zslg", "zslg/testing", "nvzn-dispatcher/testing"]

[package.metadata.layer]
role = "facade"
