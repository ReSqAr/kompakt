[graph]
all-features = true
# Development-only tools (pprof/inferno) are not shipped and may parse local
# profiling output; they are outside the runtime advisory graph.
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via postcard" },
    { id = "RUSTSEC-2024-0436", reason = "paste via tikv-jemalloc-ctl" },
]

[licenses]
version = 2
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0",
    "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0",
    "Unlicense", "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
