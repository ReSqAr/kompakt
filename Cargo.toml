# ── Workspace ─────────────────────────────────────────────────────────────────
# A virtual workspace for the storage and host layers: zslg is the replicated
# log, nvzn folds projections from it, btrb runs applications on top, and
# objectstorage-cache is their shared disk cache.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0", features = ["macros", "json"] }
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
console-subscriber = "0"
const-fnv1a-hash = "1"
crc32fast = "1"
crossbeam-channel = "0"
dashmap = "6"
futures = "0"
http-body-util = "0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0", features = ["tokio"] }
itertools = "0"
jiff = "0"
memory-stats = { version = "1", features = ["always_use_statm"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0", default-features = false, features = ["http-listener"] }
metrics-util = "0"
object_store = { version = "0.14", features = [] }
openraft = { version = "0", features = ["serde"] }
parking_lot = "0.13"
postcard = { version = "1", features = ["use-std"] }
pprof = { version = "0", features = ["flamegraph"] }
proptest = "1"
rand = "0.10"
rpassword = "7"
rust-rocksdb = { version = "0", default-features = false, features = ["zstd", "bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0"
socket2 = { version = "0", features = ["all"] }
tempfile = "3"
thiserror = "2"
tikv-jemalloc-ctl = { version = "0", features = ["use_std", "stats"] }
tikv-jemallocator = { version = "0", features = ["unprefixed_malloc_on_supported_platforms"] }
time = "0"
tokio = "1"
tokio-metrics = { version = "0", features = ["metrics-rs-integration"] }
tokio-util = "0"
tower = "0"
tower-http = { version = "0", features = ["set-header", "timeout", "trace"] }
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0", default-features = false }

btrb = { path = "crates/btrb" }
bytesize = { path = "crates/bytesize" }
crossbeam-combinators = { path = "crates/crossbeam-combinators" }
error-union = { path = "crates/error-union" }
framing = { path = "crates/framing" }
metrics-kit = { path = "crates/metrics-kit" }
nvzn = { path = "crates/nvzn" }
objectstorage-cache = { path = "crates/objectstorage-cache" }
rocksdb-kit = { path = "crates/rocksdb-kit" }
zslg-leader-membership = { path = "crates/zslg-leader-membership" }
zslg-leader-snapshot = { path = "crates/zslg-leader-snapshot" }
zslg-leader-compaction = { path = "crates/zslg-leader-compaction" }
zslg-leader-integrator = { path = "crates/zslg-leader-integrator" }
zslg-raft-setup = { path = "crates/zslg-raft-setup" }
zslg-writer = { path = "crates/zslg-writer" }
zslg-replica-service = { path = "crates/zslg-replica-service" }
zslg-replica-log = { path = "crates/zslg-replica-log" }
zslg-reader = { path = "crates/zslg-reader" }
zslg-subscriber = { path = "crates/zslg-subscriber" }
zslg-stable-archive = { path = "crates/zslg-stable-archive" }
zslg-stable-log = { path = "crates/zslg-stable-log" }
zslg-local-store = { path = "crates/zslg-local-store" }
zslg-raft-startup = { path = "crates/zslg-raft-startup" }
zslg-raft-node = { path = "crates/zslg-raft-node" }
zslg-raft-tracker = { path = "crates/zslg-raft-tracker" }
zslg-raft-state = { path = "crates/zslg-raft-state" }
zslg-raft-rpc = { path = "crates/zslg-raft-rpc" }
zslg-consensus-fake = { path = "crates/zslg-consensus-fake" }
zslg-peers = { path = "crates/zslg-peers" }
backoff-kit = { path = "crates/backoff-kit" }
raft-kit = { path = "crates/raft-kit" }
shutdown = { path = "crates/shutdown" }
warn-throttle = { path = "crates/warn-throttle" }
pace-kit = { path = "crates/pace-kit" }
zslg = { path = "crates/zslg" }
zslg-consensus = { path = "crates/zslg-consensus" }
zslg-consensus-types = { path = "crates/zslg-consensus-types" }
zslg-lifecycle-types = { path = "crates/zslg-lifecycle-types" }
zslg-log = { path = "crates/zslg-log" }
zslg-log-types = { path = "crates/zslg-log-types" }
zslg-net = { path = "crates/zslg-net" }
zslg-net-wire = { path = "crates/zslg-net-wire" }
zslg-net-types = { path = "crates/zslg-net-types" }
zslg-node-types = { path = "crates/zslg-node-types" }
zslg-quorum-read = { path = "crates/zslg-quorum-read" }
zslg-object-store-config = { path = "crates/zslg-object-store-config" }
zslg-node-id = { path = "crates/zslg-node-id" }
zslg-object-store = { path = "crates/zslg-object-store" }
zslg-hlc-clock = { path = "crates/zslg-hlc-clock" }
zslg-hlc-gate = { path = "crates/zslg-hlc-gate" }
zslg-net-client = { path = "crates/zslg-net-client" }
zslg-net-server = { path = "crates/zslg-net-server" }
zslg-net-router = { path = "crates/zslg-net-router" }
zslg-raft-storage = { path = "crates/zslg-raft-storage" }
zslg-raft = { path = "crates/zslg-raft" }
zslg-raft-types = { path = "crates/zslg-raft-types" }
zslg-snapshot = { path = "crates/zslg-snapshot" }
zslg-snapshot-types = { path = "crates/zslg-snapshot-types" }
zslg-time = { path = "crates/zslg-time" }
zslg-time-fake = { path = "crates/zslg-time-fake" }
zslg-net-fake = { path = "crates/zslg-net-fake" }
zslg-log-fake = { path = "crates/zslg-log-fake" }
zslg-time-types = { path = "crates/zslg-time-types" }

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
string_slice = "deny"
wildcard_imports = "deny"
allow_attributes_without_reason = "deny"
must_use_candidate = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[workspace.lints.rust]
unreachable_pub = "deny"
private_interfaces = "deny"
unexpected_cfgs = "deny"
unused_crate_dependencies = "deny"

[profile.dev]
debug = 2
opt-level = 0

[profile.dev.package.rust-librocksdb-sys]
debug = 0
opt-level = 1

[profile.test]
debug = 1

[profile.test.package.rust-librocksdb-sys]
debug = 0
opt-level = 1

[profile.lint]
inherits = "dev"
debug = 0
opt-level = 0
incremental = false

[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.ci.package.rust-librocksdb-sys]
debug = 0
opt-level = 1

[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"
lto = "thin"
panic = "abort"
codegen-units = 1
incremental = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
lto = false
codegen-units = 16
