name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.changed.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Which crates changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
          fi
          bash scripts/changed-crates.sh "$BASE"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libclang-dev pkg-config libssl-dev build-essential
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake libclang-dev pkg-config libssl-dev build-essential
      - run: cargo test -p "${{ matrix.crate }}" --all-targets --all-features --locked

  tests:
    name: tests
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Affected tests passed or there was nothing to test
        if: needs.test.result == 'failure' || needs.test.result == 'cancelled'
        run: exit 1

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
